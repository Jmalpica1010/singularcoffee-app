name: Catálogo

# Dos trabajos con un solo propósito: que lo que se descarga en el teléfono de
# todo el mundo esté siempre válido, y que añadir una receta no sea editar JSON
# a mano.
on:
  push:
    branches: [main]
  pull_request:
  issues:
    types: [labeled]
  workflow_dispatch:

jobs:
  validar:
    name: Validar el catálogo
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar recipes.json
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from catalogue import load, validate_catalogue, Invalid
          try:
              ids = validate_catalogue(load("recipes.json"))
          except Invalid as error:
              print(f"::error::Catálogo inválido: {error}")
              sys.exit(1)
          print(f"Catálogo válido: {len(ids)} recetas")
          PY

  fusionar:
    name: Añadir la receta aprobada
    # Solo con la etiqueta de un mantenedor. Este archivo lo descarga la app de
    # todos, así que fusionar sin más lo que publique cualquiera sería dejar que
    # un desconocido escriba en la app de los demás.
    if: github.event_name == 'issues' && github.event.label.name == 'receta aprobada'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Sacar el cuerpo de la incidencia
        env:
          BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$BODY" > /tmp/contribution.md

      - name: Fusionar en el catálogo
        id: merge
        run: |
          set +e
          output=$(python3 scripts/merge_contribution.py /tmp/contribution.md recipes.json)
          code=$?
          set -e
          echo "$output"
          {
            echo "result<<EOF"
            echo "$output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar el cambio
        if: steps.merge.outputs.code == '0'
        run: |
          # La copia empaquetada en el APK se actualiza aparte, en el repositorio
          # de desarrollo: aquí solo vive lo que se descarga.
          git config user.name "singularcoffee-bot"
          git config user.email "bot@users.noreply.github.com"
          git add recipes.json
          git commit -m "Añadir receta de la incidencia #${{ github.event.issue.number }}"
          git push

      - name: Contestar en la incidencia
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.merge.outputs.code }}' === '0';
            // `toJSON` ya entrega una cadena JS válida y entrecomillada, así que
            // se usa tal cual. Envolverla en una plantilla de acentos graves la
            // rompía: el mensaje de éxito lleva el id entre acentos graves, y uno
            // de esos dentro de la plantilla la termina antes de tiempo. La receta
            // se fusionaba y el comentario fallaba con un error de sintaxis.
            const detail = ${{ toJSON(steps.merge.outputs.result) }};
            const tail = ok
              ? '\n\nYa está en el catálogo. Llega a las apps en la siguiente sincronización; en Ajustes → Recetas de la comunidad se puede forzar.'
              : '\n\nLa etiqueta se quita para poder reintentarlo después de corregirlo.';
            const body = detail + tail +
              '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number, body,
            });
            if (ok) {
              await github.rest.issues.update({
                ...context.repo, issue_number: context.issue.number,
                state: 'closed', state_reason: 'completed',
              });
            } else {
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: context.issue.number,
                name: 'receta aprobada',
              });
            }
